global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: sfb-api-devnet
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /tmp/prometheus_username
      password_file: /tmp/prometheus_password    
    static_configs:
      - targets:
        - sfb-api-service.railway.internal:8080

